---
layout: default
---
<section class="wrap gallery-page" aria-labelledby="gallery-title">
  <a class="back-link" href="{{ '/' | relative_url }}">← Back to the homepage</a>
  <header class="gallery-header">
    <p class="eyebrow">Photo notebook <span class="eyebrow-slash">/</span> {{ site.data.photographs.size }} frames</p>
    <h1 class="page-title" id="gallery-title">{{ page.title }}</h1>
    <div class="gallery-intro prose">{{ content }}</div>
  </header>

  <div class="photo-grid gallery-grid">
    {% for photo in site.data.photographs %}
    <figure class="photo-card">
      <img src="{{ photo.image | relative_url }}" alt="{{ photo.alt | escape }}"{% if photo.width and photo.height %} width="{{ photo.width }}" height="{{ photo.height }}"{% endif %} loading="lazy" decoding="async">
      <figcaption class="photo-card-caption">
        <span class="photo-card-index">{{ forloop.index | prepend: '0' }}</span>
        <span class="photo-card-title">{{ photo.title }}</span>
      </figcaption>
    </figure>
    {% endfor %}
  </div>
</section>

---
layout: default
---
<section class="wrap prose-page">
  <p class="eyebrow page-eyebrow">A little context</p>
  <h1 class="page-title">{{ page.title | escape }}</h1>
  <div class="page-body{% if page.image %} page-body-with-image{% endif %}">
    <div class="prose">{{ content }}</div>
    {% if page.image %}<img class="about-image" src="{{ page.image | relative_url | escape }}" alt="{{ page.image_alt | escape }}"{% if page.image_width and page.image_height %} width="{{ page.image_width | escape }}" height="{{ page.image_height | escape }}"{% endif %} loading="lazy" decoding="async">{% endif %}
  </div>
</section>

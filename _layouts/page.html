---
layout: default
---
<section class="wrap prose-page">
  <p class="eyebrow page-eyebrow">A little context</p>
  <h1 class="page-title">{{ page.title }}</h1>
  <div class="page-body{% if page.image %} page-body-with-image{% endif %}">
    <div class="prose">{{ content }}</div>
    {% if page.image %}<img class="about-image" src="{{ page.image | relative_url }}" alt="{{ page.image_alt | escape }}">{% endif %}
  </div>
</section>

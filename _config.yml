title: "Šimon Káňa"
tagline: "Software, songs, climbing, and first steps in photography."
email: "simon.kana@seznam.cz"
description: "Šimon Káňa is a freelance software engineer in Prague who plays guitar, sings, and climbs. He is beginning to explore photography and filmmaking with an iPhone 11."
baseurl: ""
url: "https://simonkana.github.io"
author:
  name: "Šimon Káňa"
  email: "simon.kana@seznam.cz"
lang: en
locale: en_US
timezone: Europe/Prague
permalink: /journal/:year/:month/:day/:title/
markdown: kramdown

social:
  name: "Šimon Káňa"
  links:
    - https://github.com/simonkana
    - https://www.youtube.com/@simon-kana

collections:
  work:
    output: true
    permalink: /work/:name/

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      image: /assets/me.webp
  - scope:
      path: ""
      type: work
    values:
      layout: project

plugins:
  - jekyll-feed
  - jekyll-seo-tag

header_pages:
  - about.markdown

exclude:
  - temp/
  # Keep full-resolution source photos in the repo; publish only optimized copies.
  - assets/me.jpg
  - assets/photos/01-under-an-autumn-sky.jpg
  - assets/photos/01-under-an-autumn-sky.webp
  - assets/photos/02-the-everyday-passage.jpg
  - assets/photos/02-the-everyday-passage.webp
  - assets/photos/03-the-walk-home.jpg
  - assets/photos/03-the-walk-home.webp
  - assets/photos/04-light-through-the-blinds.jpg
  - assets/photos/04-light-through-the-blinds.webp
  - assets/photos/05-a-familiar-shape.jpg
  - assets/photos/05-a-familiar-shape.webp
  - assets/photos/06-amber-after-dark.jpg
  - assets/photos/06-amber-after-dark.webp
